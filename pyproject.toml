[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jiheng-mcp"
version = "0.3.6"
description = "Jiheng (玑衡): an exact computation layer for AI agents over MCP. Fractions, radicals, symbolic math, statistics, finance, units, dates, parallel shards."
readme = "README.en.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["sympy>=1.12"]
keywords = ["mcp", "calculator", "exact", "sympy", "ai", "jiheng"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
  "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/CQQOOQ123/jiheng"
Repository = "https://github.com/CQQOOQ123/jiheng"
Issues = "https://github.com/CQQOOQ123/jiheng/issues"

[project.scripts]
jiheng-mcp = "mcp_server:main"

[tool.hatch.build.targets.wheel.force-include]
"calc_core.py" = "calc_core.py"
"mcp_server.py" = "mcp_server.py"
"packs" = "packs"

[tool.hatch.build.targets.sdist]
include = [
  "calc_core.py",
  "mcp_server.py",
  "packs",
  "README.md",
  "README.en.md",
  "AI-USAGE.md",
  "PACKS.md",
  "QUALITY.md",
]
